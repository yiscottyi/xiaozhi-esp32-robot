name: ESP32 Build CI

# 触发条件：push 到 main、PR 到 main、手动运行
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 有子模块时必须开

      # 缓存 ESP-IDF 工具链，加快下次编译
      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/esp/esp-idf
            ~/.espressif
          key: ${{ runner.os }}-esp-idf-v5.1

      # 安装依赖
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      # 下载 ESP-IDF（这里用 v5.1，可改）
      - name: Download ESP-IDF
        run: |
          mkdir -p ~/esp
          cd ~/esp
          if [ ! -d "esp-idf" ]; then
            git clone -b v5.1 --recursive https://github.com/espressif/esp-idf.git
          fi
          cd esp-idf
          ./install.sh esp32  # 你是 ESP32 就写 esp32；S3 写 esp32s3

      # 编译你的项目
      - name: Build firmware
        run: |
          source ~/esp/esp-idf/export.sh
          cd $GITHUB_WORKSPACE
          idf.py set-target esp32   # 和上面一致
          idf.py build

      # 上传编译产物（bin/elf 等）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            build/*.bin
            build/*.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
